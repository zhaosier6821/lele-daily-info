name: Validate Lele Daily

on:
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "index.html"

permissions:
  contents: read

concurrency:
  group: lele-daily-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate archive and issues
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_dir = Path("data")
          archive = json.loads((data_dir / "archive.json").read_text(encoding="utf-8"))
          dates = archive["dates"]

          assert dates == sorted(set(dates)), "archive dates must be sorted and unique"
          for date in dates:
              issue = json.loads((data_dir / f"{date}.json").read_text(encoding="utf-8"))
              if "date" in issue:
                  assert issue["date"] == date, f"date mismatch in {date}.json"
              cards = issue.get("cards", issue.get("sections", []))
              assert cards, f"no cards in {date}.json"
              for index, card in enumerate(cards, start=1):
                  assert card.get("source"), f"missing source in {date}.json card {index}"

          print(f"Validated {len(dates)} issues")
          PY
