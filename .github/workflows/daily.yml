name: Update Lele Daily

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: lele-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate today's issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_daily.py
      - name: Publish archive
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "lele-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Update Lele Daily $(TZ=Asia/Shanghai date +%F)"
          git push
