<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>乐乐每日情报</title><style>body{margin:0;background:#f7f4ed;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:1000px;margin:auto;padding:32px 20px}h1{font-size:42px}.intro{color:#777}.calendar{background:#fff;border-radius:24px;padding:20px;margin:24px 0}.day{display:inline-block;padding:8px 14px;background:#f1eee7;border-radius:14px;margin:5px}.active{background:#333;color:#fff}.waterfall{columns:2;column-gap:18px}.card{break-inside:avoid;border-radius:24px;padding:24px;margin-bottom:18px;cursor:pointer;line-height:1.8}.card:hover{transform:translateY(-2px)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);padding:20px;z-index:10}.article{background:#fff;max-width:720px;margin:30px auto;padding:30px;border-radius:24px;line-height:2}.close{float:right;font-size:24px}@media(max-width:700px){.waterfall{columns:1}}</style></head><body><div class="wrap"><h1>🌍 乐乐每日情报</h1><div class="intro">每日8:00更新｜全球财经、产业趋势、游戏、旅行、健康与生活方式观察。</div><div class="calendar"><b>📅 历史日报</b><br><span class="day">7/30</span><span class="day">7/31</span><span class="day active">8/1</span></div><div id="list" class="waterfall"></div></div><div id="modal" class="modal"><div class="article"><span class="close" onclick="closeArticle()">×</span><h2 id="title"></h2><div id="content"></div></div></div><script>fetch('data/2026-08-01.json').then(r=>r.json()).then(data=>{window.news=data.sections;list.innerHTML=data.sections.map((x,i)=>`<div class="card" style="background:${['#edf3ef','#f5eee5','#edf0f6','#f3edf3','#edf5f5','#f5f1e6'][i%6]}" onclick="openArticle(${i})"><small>${x.source}</small><h2>${x.title}</h2><p>${x.content.slice(0,100)}...</p></div>`).join('')});function openArticle(i){let x=window.news[i];title.innerText=x.title;content.innerHTML=x.content.replace(/\n/g,'<br>');modal.style.display='block'}function closeArticle(){modal.style.display='none'}</script></body></html>
