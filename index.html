<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f0e9">
  <meta name="description" content="乐乐日报——每天早晨 8 点更新的经济、游戏、旅行与生活情报。">
  <title>乐乐日报</title>
  <style>
    :root{--ink:#292824;--muted:#77746c;--paper:#f3f0e9;--line:rgba(41,40,36,.12);--white:rgba(255,255,255,.58)}*{box-sizing:border-box}
    html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif}
    button,input{font:inherit}.wrap{max-width:1320px;margin:auto;padding:48px 28px 88px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:36px}
    .eyebrow{font-size:11px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}.title{font-family:Georgia,"Songti SC",serif;font-size:clamp(48px,7vw,88px);font-weight:500;letter-spacing:-.06em;margin:6px 0 4px}.sub{color:var(--muted);font-size:14px}
    .calendar{display:flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:7px;box-shadow:0 8px 30px rgba(41,40,36,.04)}.calendar button{border:0;background:transparent;width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:20px;color:var(--ink)}.calendar button:hover:not(:disabled){background:#fff}.calendar button:disabled{opacity:.25;cursor:not-allowed}.calendar input{border:0;background:transparent;color:var(--ink);padding:0 5px;outline:0}
    .status{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
    .grid{columns:4 270px;column-gap:16px}.card{break-inside:avoid;margin:0 0 16px;padding:22px;border-radius:24px;background:var(--c);transition:transform .2s ease,box-shadow .2s ease}.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(41,40,36,.07)}
    .tag{display:inline-flex;border:1px solid rgba(41,40,36,.16);border-radius:999px;padding:5px 9px;font-size:11px;letter-spacing:.06em}.card h2{font-family:Georgia,"Songti SC",serif;font-size:23px;line-height:1.38;margin:17px 0 11px;font-weight:600}.lead{font-size:14px;line-height:1.82;margin:0}.meta{font-size:12px;color:var(--muted);margin-top:16px}.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}.more>div{overflow:hidden}.more.show{grid-template-rows:1fr}.detail{padding-top:14px;margin-top:14px;border-top:1px solid rgba(41,40,36,.13);font-size:13px;line-height:1.86}.detail p{margin:0 0 10px}.detail ol,.detail ul{padding-left:20px}.source{display:inline-block;color:inherit;margin-top:7px;font-size:12px;text-underline-offset:3px}.toggle{margin-top:15px;padding:0;border:0;border-bottom:1px solid currentColor;background:transparent;color:var(--ink);font-size:12px;cursor:pointer}.empty{column-span:all;padding:64px 20px;text-align:center;color:var(--muted);background:#e9e5dd;border-radius:28px}.loading{opacity:.58}
    @media(max-width:720px){.wrap{padding:28px 16px 64px}.top{align-items:flex-start;flex-direction:column}.calendar{width:100%;justify-content:space-between}.grid{columns:1}.title{font-size:54px}.card{border-radius:20px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div><div class="eyebrow">Economy · Culture · Living</div><h1 class="title">奶香乐乐酱de世界之窗咩</h1><div class="sub">每天早晨 8:00，把世界里值得知道的变化打捞上来。</div></div>
      <div class="calendar"><button id="prev" aria-label="前一天">‹</button><input id="date" type="date" aria-label="选择日报日期"><button id="next" aria-label="后一天">›</button></div>
    </header>
    <div class="status"><span id="dateLabel"></span><span id="count"></span></div>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>
  <script>
    const colors=['#dfe7df','#e7dfd8','#dfe3e9','#e9e2d2','#e6dfe7','#dce7e5','#ebe3df','#e2e5d8','#e6e0d7'];
    const ui={grid:document.querySelector('#grid'),date:document.querySelector('#date'),label:document.querySelector('#dateLabel'),count:document.querySelector('#count'),prev:document.querySelector('#prev'),next:document.querySelector('#next')};
    let dates=[];
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt=d=>new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date(d+'T12:00:00'));
    function card(x,i){const legacy=!x.tag,parts=legacy?String(x.content||'').split(/\n\n+/):[],tag=legacy?String(x.title).split('｜')[0]:x.tag,title=legacy?(String(x.title).split('｜')[1]||x.title):x.title,lead=legacy?(parts.shift()||''):x.lead,paragraphs=legacy?parts:(Array.isArray(x.detail)?x.detail:[x.detail]),link=String(x.source||'').startsWith('http')?`<a class="source" href="${esc(x.source)}" target="_blank" rel="noopener noreferrer">查看原始来源 ↗</a>`:'';return `<article class="card" style="--c:${colors[i%colors.length]}"><span class="tag">${esc(tag)}</span><h2>${esc(title)}</h2><p class="lead">${esc(lead)}</p><div class="meta">${esc(x.sourceName||x.source||'资料整理')}</div><div class="more" id="more-${i}"><div><div class="detail">${paragraphs.filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}${link}</div></div></div><button class="toggle" data-id="more-${i}" aria-expanded="false">展开阅读 ↓</button></article>`}
    async function render(){const d=ui.date.value;ui.grid.classList.add('loading');ui.label.textContent=fmt(d);ui.count.textContent='正在打捞…';try{const res=await fetch(`data/${d}.json?b=${Date.now()}`);if(!res.ok)throw new Error('missing');const data=await res.json();const items=data.cards||data.sections||[];ui.grid.innerHTML=items.map(card).join('');ui.count.textContent=`${items.length} 条精选`;document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const box=document.getElementById(b.dataset.id);const open=box.classList.toggle('show');b.setAttribute('aria-expanded',open);b.textContent=open?'收起 ↑':'展开阅读 ↓'});}catch(e){ui.grid.innerHTML='<div class="empty">这一天还没有日报。可以从日历里选择一个有内容的日期。</div>';ui.count.textContent='暂无日报'}finally{ui.grid.classList.remove('loading');updateNav()}}
    function move(n){const i=dates.indexOf(ui.date.value),next=dates[i+n];if(next){ui.date.value=next;render()}}
    function updateNav(){const i=dates.indexOf(ui.date.value);ui.prev.disabled=i<=0;ui.next.disabled=i<0||i>=dates.length-1}
    async function init(){try{const r=await fetch(`data/archive.json?b=${Date.now()}`);const archive=await r.json();dates=(Array.isArray(archive)?archive:(archive.dates||[])).slice().sort();}catch(e){dates=['2026-08-01']}const latest=dates.at(-1);ui.date.min=dates[0];ui.date.max=latest;ui.date.value=latest;ui.prev.onclick=()=>move(-1);ui.next.onclick=()=>move(1);ui.date.onchange=render;render()}
    init();
  </script>
</body>
</html>
