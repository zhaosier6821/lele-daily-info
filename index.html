<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>乐乐每日情报</title>
<style>
body{margin:0;background:#f7f4ed;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:1000px;margin:auto;padding:32px 20px}h1{font-size:42px;margin:0 0 8px}.intro{color:#777;line-height:1.7}.calendar{background:#fff;border-radius:24px;padding:20px;margin:24px 0}.days{display:flex;gap:8px;flex-wrap:wrap}.day{padding:8px 14px;background:#f1eee7;border-radius:14px}.active{background:#333;color:#fff}.waterfall{columns:2;column-gap:18px}.card{break-inside:avoid;border-radius:24px;padding:24px;margin-bottom:18px;line-height:1.8;cursor:pointer}.card:hover{transform:translateY(-2px)}.tag{font-size:13px;color:#777}.a{background:#edf3ef}.b{background:#f5eee5}.c{background:#edf0f6}.d{background:#f3edf3}.e{background:#edf5f5}.f{background:#f5f1e6}@media(max-width:700px){.waterfall{columns:1}h1{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🌍 乐乐每日情报</h1>
<div class="intro">每日 8:00 更新｜全球财经、产业趋势、游戏、旅行、健康与生活方式观察。</div>
<div class="calendar"><b>📅 历史日报</b><div class="days"><div class="day">7/30</div><div class="day">7/31</div><div class="day active">8/1</div></div></div>
<div id="list" class="waterfall"></div>
</div>
<script>
fetch('data/2026-08-01.json').then(r=>r.json()).then(data=>{document.getElementById('list').innerHTML=data.sections.map((x,i)=>`<div class="card ${['a','b','c','d','e','f'][i%6]}"><div class="tag">每日情报</div><h2>${x.title}</h2><p>${x.content}</p></div>`).join('')})
</script>
</body>
</html>
