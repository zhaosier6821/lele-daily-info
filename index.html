<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>乐乐每日情报</title>
<style>
:root{--ink:#20211f;--paper:#f4f1eb;--line:rgba(32,33,31,.16)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Noto Sans SC",sans-serif}.hero{padding:0 5vw 70px;border-bottom:1px solid var(--line);min-height:520px;background:radial-gradient(circle at 80% 20%,#dce7df,transparent 30%),var(--paper)}nav{height:88px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.18em}.intro{margin-top:90px}h1{font-family:Georgia,serif;font-size:clamp(55px,8vw,100px);font-weight:500;line-height:1}.calendar{position:absolute;right:5vw;top:100px;background:#faf8f3;border:1px solid var(--line);padding:20px;border-radius:18px}.stream{columns:3 300px;column-gap:20px;padding:50px 5vw}.card{break-inside:avoid;margin-bottom:20px;padding:28px;border:1px solid rgba(0,0,0,.08);cursor:pointer}.card h2{font-family:Georgia,serif}.modal{display:none;position:fixed;inset:0;background:#0005;padding:30px}.article{background:#fff;max-width:760px;margin:auto;padding:35px;border-radius:20px;line-height:2}@media(max-width:700px){.stream{columns:1}.calendar{display:none}}
</style>
</head>
<body>
<header class="hero"><nav><div class="brand">LELE DAILY</div><div>日历回看</div></nav><div class="intro"><p>每日情报切片 · 北京时间 08:00 更新</p><h1>世界很大。<br>挑值得了解的。</h1></div></header>
<div id="stream" class="stream"></div>
<div id="modal" class="modal" onclick="this.style.display='none'"><article class="article" onclick="event.stopPropagation()"><h2 id="title"></h2><div id="content"></div></article></div>
<script>
const data=[{tag:'全球财经',title:'全球经济与产业趋势观察',content:'背景：今日全球财经政策与产业变化整理。\n\n后续将持续按照财经政策、中国新经济、产业结构、投资趋势进行深度解析。'},{tag:'旅行生活',title:'世界旅行路线与生活方式',content:'包含路线规划、交通、住宿、餐饮预算以及当地生活方式观察。'},{tag:'健康生活',title:'健身、咖啡与健康饮食',content:'记录健康生活方式、训练趋势、咖啡文化与简单菜谱。'}];
stream.innerHTML=data.map((x,i)=>`<section class="card" onclick="openA(${i})"><small>${x.tag}</small><h2>${x.title}</h2><p>${x.content.slice(0,70)}...</p></section>`).join('');window.openA=i=>{title.innerText=data[i].title;content.innerHTML=data[i].content.replace(/\n/g,'<br>');modal.style.display='block'};
</script>
</body></html>
