<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>乐乐每日情报</title>
<style>
body{margin:0;background:#f7f5ef;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:900px;margin:auto;padding:30px 18px}h1{font-size:40px;margin:0}.intro{color:#777;line-height:1.7;margin:12px 0 24px}.calendar{background:#fff;border-radius:20px;padding:20px;margin-bottom:24px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{text-align:center;padding:10px;border-radius:12px;background:#f3f1eb}.active{background:#222;color:#fff}.waterfall{columns:2;column-gap:16px}.card{break-inside:avoid;padding:22px;border-radius:22px;margin-bottom:16px;line-height:1.7;cursor:pointer}.card h2{margin-top:0;font-size:22px}.a{background:#eef5f1}.b{background:#f7f0e8}.c{background:#eef1f7}.d{background:#f5edf4}.e{background:#eef5f5}.f{background:#f6f3e8}@media(max-width:600px){.waterfall{columns:1}}
</style>
</head>
<body>
<div class="wrap">
<h1>🌍 乐乐每日情报</h1>
<div class="intro">每日早晨8点更新，探索世界变化：财经、产业、旅行、游戏、健康、音乐与生活方式。</div>
<div class="calendar"><b>📅 历史日期</b><div class="days"><div class="day">7/29</div><div class="day">7/30</div><div class="day">7/31</div><div class="day active">8/1</div></div></div>
<div class="waterfall">
<div class="card a"><h2>💰 全球财经雷达</h2>关注政策变化、市场趋势与全球经济事件。</div>
<div class="card b"><h2>🇨🇳 中国新经济观察</h2>追踪产业升级、新商业模式和消费变化。</div>
<div class="card c"><h2>🎮 海外游戏圈</h2>发现新游戏、新玩法与行业趋势。</div>
<div class="card d"><h2>✈️ 世界旅行指南</h2>整理路线、预算和目的地灵感。</div>
<div class="card e"><h2>💪 健康生活</h2>健身、运动、咖啡、饮食与生活方式。</div>
<div class="card f"><h2>🎵 全球音乐趋势</h2>关注海外音乐动态和文化变化。</div>
</div>
</div>
</body>
