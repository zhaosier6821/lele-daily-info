<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f4f1eb" />
  <title>乐乐日报</title>
  <style>
    :root{--ink:#292824;--muted:#77746c;--paper:#f4f1eb;--line:rgba(41,40,36,.12)}*{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif}
    .wrap{max-width:1280px;margin:auto;padding:48px 28px 80px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:38px}
    .eyebrow{font-size:12px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}.title{font-family:Georgia,"Songti SC",serif;font-size:clamp(42px,7vw,86px);font-weight:500;letter-spacing:-.06em;margin:7px 0 5px}.sub{color:var(--muted);font-size:14px}
    .calendar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.52);border:1px solid var(--line);border-radius:18px;padding:8px}.calendar button{border:0;background:transparent;width:35px;height:35px;border-radius:12px;cursor:pointer;font-size:18px;color:var(--ink)}.calendar button:hover{background:#fff}.calendar input{border:0;background:transparent;font:inherit;color:var(--ink);padding:0 4px;outline:0}
    .status{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
    .grid{columns:4 260px;column-gap:16px}.card{break-inside:avoid;margin:0 0 16px;padding:22px;border-radius:24px;background:var(--c,#e7e4dc);transition:transform .2s ease}.card:hover{transform:translateY(-2px)}
    .tag{display:inline-flex;border:1px solid rgba(41,40,36,.16);border-radius:999px;padding:5px 9px;font-size:11px;letter-spacing:.08em}.card h2{font-family:Georgia,"Songti SC",serif;font-size:23px;line-height:1.34;margin:18px 0 11px;font-weight:600}.lead{font-size:14px;line-height:1.82;margin:0}.meta{font-size:12px;color:var(--muted);margin-top:16px}.more{display:none;padding-top:14px;margin-top:14px;border-top:1px solid rgba(41,40,36,.13);font-size:13px;line-height:1.82}.more.show{display:block}.more p{margin:0 0 10px}.more ol,.more ul{padding-left:20px}.toggle{margin-top:15px;padding:0;border:0;border-bottom:1px solid currentColor;background:transparent;color:var(--ink);font:inherit;font-size:12px;cursor:pointer}.source{display:inline-block;color:inherit;margin-top:8px;font-size:12px}.empty{padding:60px 20px;text-align:center;color:var(--muted);background:#ebe7df;border-radius:28px}
    @media(max-width:720px){.wrap{padding:28px 16px 60px}.top{align-items:flex-start;flex-direction:column}.calendar{width:100%;justify-content:space-between}.grid{columns:1}.title{font-size:52px}.card{border-radius:20px}}
  </style>
</head>
<body><main class="wrap"><header class="top"><div><div class="eyebrow">Ideas · Economy · Living</div><h1 class="title">乐乐日报</h1><div class="sub">每天早晨 8:00，把世界里值得知道的变化打捞上来。</div></div><div class="calendar"><button id="prev" aria-label="前一天">‹</button><input id="date" type="date"><button id="next" aria-label="后一天">›</button></div></header><div class="status"><span id="dateLabel"></span><span id="count"></span></div><section id="grid" class="grid"></section></main>
<script>
const colors=['#dfe7df','#e7dfd8','#dfe3e9','#e9e2d2','#e6dfe7','#dce7e5','#ebe3df','#e2e5d8'];
const dailyData={
'2026-08-01':[
 {tag:'中国经济',title:'下半年的关键词，不只是“稳增长”，而是把增长动力换一遍',lead:'上半年中国 GDP 同比增长 4.7%。更值得看的是结构：制造业占 GDP 比重升至 26.2%，新能源汽车零售渗透率连续三个月超过 60%，高端制造、数字经济和现代服务等新动能贡献了超过四成增长。',detail:'<p>7 月 30 日的政策信号把“扩大内需、优化供给、保障民生”放在一起，意味着下半年不会只靠传统基建托底，而是希望消费、先进制造和服务业共同接力。</p><p>世界银行的判断更谨慎：房地产调整、居民消费偏弱和外需放缓仍会拖累增长，预计 2026 年增速约 4.4%。它特别指出，社会保障支出约占 GDP 的 11%，提高保障覆盖有助于减少预防性储蓄——也就是让人敢花钱，比单纯发消费刺激更根本。</p>',source:'https://www.news.cn/politics/20260730/696fa5500b6a4ef98bf0cd02a9f398d3/c.html',sourceName:'新华社 / 世界银行'},
 {tag:'全球财经',title:'全球经济在放慢，但“战争冲击 + AI 投资”让各国走势越来越分叉',lead:'IMF 7 月更新预计 2026 年全球增长约 3.0%。美国二季度 GDP 折年率增长 1.5%，较一季度的 2.1%明显放缓；消费、投资和出口仍在增长，但整体动能变弱。',detail:'<p>现在的全球经济并不是整齐划一地下行：能源进口国更怕成本冲击，AI 投资集中的经济体则得到资本开支支撑。政策难点是，央行一边要防通胀再起，一边又不能让高利率把需求压得太狠。</p><p>美国有效关税率已升到约 15.8%，企业将继续在涨价、压利润和重组供应链之间做选择。关税不是一次性新闻，它会慢慢改变产业落点与消费者价格。</p>',source:'https://www.imf.org/en/publications/weo',sourceName:'IMF / BEA'},
 {tag:'产业构成',title:'绿色技能开始形成真实工资溢价：会“转型”的人，比只懂单一工种的人更值钱',lead:'世界银行基于招聘数据发现，掌握绿色技能的劳动者可获得约 22%—25% 的工资溢价，而且需求已经从新能源行业外溢到普通岗位。',detail:'<p>矛盾也很尖锐：超过三分之一能源企业难以招聘到兼具跨学科与数字技能的人才；在高度依赖煤炭的地区，约 85% 的化石能源从业者暂不具备转入可再生能源行业所需资质。</p><p>这说明产业升级不只发生在厂房和设备里，还发生在劳动者的技能结构里。未来更耐用的能力组合会是“行业知识 + 数字工具 + 系统思维”，而不是单押一个软件。</p>',source:'https://thedocs.worldbank.org/en/doc/1ef2e7b9c02124a80292f5d43cce0961-0070012026/original/CEU-July-2026-CN.pdf',sourceName:'世界银行'},
 {tag:'国外游戏',title:'8 月游戏先看这三款：重生之兽、越战战术射击、瘟疫传说新章',lead:'《Beast of Reincarnation》将于 8 月 4 日登陆 PC、PS5 与 Xbox；《Hell Let Loose: Vietnam》主打大规模多人战术；《Resonance: A Plague Tale Legacy》延续叙事冒险路线。',detail:'<p>如果想要强叙事，优先关注《Resonance》；想跟朋友组队且能接受高沟通成本，看《Hell Let Loose: Vietnam》；想试新 IP 的动作 RPG，则看《Beast of Reincarnation》。</p><p>本月被追踪的跨平台发行超过 300 款，小体量独立游戏数量很大，日报以后会少报“清单”，多挑真正有玩法差异的作品。</p>',source:'https://gamingbuddy.eu/release-calendar/2026/august',sourceName:'GamingBuddy'},
 {tag:'旅行路线',title:'格鲁吉亚 7 日：第比利斯—卡兹别克—卡赫季，把高加索装进一趟短假',lead:'适合喜欢山、酒和旧城的人。按双人同行、人均中等预算估算：机票 ¥4,500—6,500，住宿 ¥1,400—2,100，城际与包车 ¥900—1,400，餐饮 ¥900—1,300，门票杂费约 ¥300，总计约 ¥8,000—11,600。',detail:'<ol><li>Day 1–2：第比利斯旧城、硫磺浴、山顶夜景。</li><li>Day 3–4：军用公路到卡兹别克，徒步或四驱车去圣三一教堂。</li><li>Day 5：回程停阿纳努里城堡与水库。</li><li>Day 6：卡赫季酒庄与西格纳吉。</li><li>Day 7：第比利斯咖啡馆与返程。</li></ol><p>价格为从北京出发的动态参考，不含购物；机票和包车季节波动最大，真正预订前需重新核价。</p>',source:'https://georgia.travel/',sourceName:'Georgia Travel'},
 {tag:'健身健康',title:'别把“每天走一万步”当神谕：真正有效的是把久坐切碎',lead:'对长期坐办公室的人，最划算的改变不是某天爆走两万步，而是每 30—60 分钟起身活动 2—5 分钟，再叠加每周稳定的力量训练和中等强度有氧。',detail:'<p>执行版：上午与下午各安排一次 8—10 分钟快走；午饭后走 10 分钟；每周至少 2 次全身力量训练。步数是结果指标，不是健康本身。</p><p>如果本来训练量已经不低，继续堆步数未必比增加睡眠更有收益。观察疲劳、静息心率和训练表现，比迷信单一数字靠谱。</p>',source:'https://www.who.int/news-room/fact-sheets/detail/physical-activity',sourceName:'WHO'},
 {tag:'机车',title:'雨季骑行不是“慢一点”就够了，轮胎状态比你的胆量更重要',lead:'湿地制动距离增加，井盖、标线与落叶的抓地力会突然下降。检查胎纹、胎压、刹车片和灯光，比升级外观件优先级高得多。',detail:'<ul><li>入弯前完成减速，弯中动作要柔。</li><li>跟车距离至少比干地明显增加。</li><li>避免在斑马线、金属盖板上重刹或大油门。</li><li>骑行服要防水，但别牺牲护具。</li></ul><p>如果能见度太差或路面积水无法判断深度，最专业的选择就是不骑。</p>',source:'https://www.msf-usa.org/',sourceName:'Motorcycle Safety Foundation'},
 {tag:'新兴生活',title:'“兴趣微度假”正在替代打卡式旅行：人们先选一件事，再选目的地',lead:'越来越多人围绕攀岩、潜水、陶艺、咖啡、音乐节或植物观察规划 2—4 天短途，不追景点数量，而追求一段可沉浸、可学习、能带走技能的体验。',detail:'<p>这种旅行的关键不是把课程塞满，而是只留一个主任务。例如“上午抱石 + 下午逛旧书店”，比一天跑八个地标更不累，也更容易留下具体记忆。</p><p>做预算时，把课程、装备租赁和本地交通列成核心支出，住宿反而可以退到第二优先级。</p>',source:'https://www.unwto.org/tourism-data',sourceName:'UN Tourism'},
 {tag:'全球音乐榜',title:'本周 Global 200：世界杯歌继续第一，旧歌与 K-pop 同时回潮',lead:'榜首是 Shakira × Burna Boy 的《DAI DAI》；Ariana Grande《Hate That I Made You Love Me》与 Ella Langley《Choosin’ Texas》位居前列，BTS《Normal》重返第 4，《Swim》第 10。',detail:'<p>已确认的前十席位还包括 Oasis《Wonderwall》、JENNIE × Tame Impala《Dracula – Jennie Remix》等。完整名次以 Billboard 8 月 1 日榜单为准；这个榜统计全球 200 多个地区的流媒体与数字销量。</p><p>值得注意的不是某一首歌，而是“赛事主题曲 + 经典老歌 + K-pop 长尾”同时占据高位，全球流行市场正越来越事件化，也越来越不按发行年份排序。</p>',source:'https://ca.billboard.com/charts/billboard-global-200/2026-08-01',sourceName:'Billboard Global 200'},
 {tag:'咖啡知识',title:'为什么同一包豆子，今天甜、明天酸？先别怪豆子，水温和流速更可疑',lead:'咖啡萃取不是“越久越浓越好”。偏酸、单薄通常是萃取不足；苦涩、干燥可能是过萃。研磨度、粉水比、水温和注水扰动共同决定味道。',detail:'<p>手冲排查顺序：先固定 15g 粉、240g 水与 92℃；如果酸薄，研磨略细或延长萃取；如果苦涩，略粗研磨或降低水温。一次只改一个变量，否则喝完也不知道是谁干的。</p><p>深烘焙可用稍低水温，浅烘焙往往需要更高温与更充分萃取。</p>',source:'https://sca.coffee/research',sourceName:'Specialty Coffee Association'},
 {tag:'DIY 调酒',title:'今晚做一杯 Espresso Tonic：咖啡苦香和气泡感，比甜酒更适合夏夜',lead:'配方：汤力水 120ml、浓缩咖啡 30—40ml、冰块满杯、橙皮一片。先倒汤力水，再把稍微降温的浓缩沿冰块慢慢倒入，分层会更漂亮。',detail:'<p>想更清爽，加 5ml 柠檬汁；想更像鸡尾酒，可加 20ml 金酒，但别用过甜的汤力水。橙皮只挤香气，不要把白色内皮泡太久，否则会苦。</p><p>无酒精版本本身就完整。咖啡因敏感的人晚间用低因浓缩。</p>',source:'https://www.diffordsguide.com/',sourceName:'Difford’s Guide'},
 {tag:'健康菜谱',title:'15 分钟高蛋白晚餐：柠檬黑椒鸡肉温沙拉',lead:'鸡胸或去皮鸡腿 150g、彩椒半个、蘑菇 100g、混合生菜一把、无糖酸奶 30g、柠檬半个。蛋白质约 35—40g，蔬菜量也够。',detail:'<p>鸡肉切薄片，用黑胡椒、少量盐和蒜粉煎熟；同锅炒蘑菇和彩椒。酸奶加柠檬汁、盐与一点橄榄油做酱，最后与生菜拌匀。</p><p>训练日可加一小份米饭或土豆，不训练也不用故意戒碳水。若要控制热量，先管油和酱，而不是砍掉所有主食。</p>',source:'https://www.hsph.harvard.edu/nutritionsource/healthy-eating-plate/',sourceName:'Harvard Nutrition Source'},
 {tag:'可能有用',title:'你的数字遗产也需要“紧急联系人”：不是晦气，是现代人的基础整理',lead:'重要账号、订阅、云盘、设备解锁与自动续费如果完全只存在一个人脑子里，遇到手机丢失、住院或意外时，会变成家人无法处理的黑箱。',detail:'<p>今天只做 20 分钟：列出最重要的 10 个账号；开启密码管理器的紧急访问；记录设备恢复方式；检查 Apple/Google 的遗产联系人设置；把“哪些内容可以交给谁”写清楚。</p><p>不要把所有明文密码发给别人。目标是建立可控的授权路径，而不是制造新的泄露风险。</p>',source:'https://support.apple.com/en-us/102631',sourceName:'Apple Support'}
]};
const el={grid:document.querySelector('#grid'),date:document.querySelector('#date'),label:document.querySelector('#dateLabel'),count:document.querySelector('#count')};
const latest=Object.keys(dailyData).sort().at(-1); el.date.max=latest; el.date.value=latest;
function fmt(d){return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date(d+'T12:00:00'))}
function render(){const d=el.date.value,items=dailyData[d]||[];el.label.textContent=fmt(d);el.count.textContent=items.length?`${items.length} 条精选`:'暂无日报';el.grid.innerHTML=items.length?items.map((x,i)=>`<article class="card" style="--c:${colors[i%colors.length]}"><span class="tag">${x.tag}</span><h2>${x.title}</h2><p class="lead">${x.lead}</p><div class="meta">${x.sourceName}</div><div class="more" id="m${i}">${x.detail}<a class="source" href="${x.source}" target="_blank" rel="noopener">查看来源 ↗</a></div><button class="toggle" data-id="m${i}">展开阅读 ↓</button></article>`).join(''):'<div class="empty">这一天还没有日报。去看看有内容的日期吧。</div>';document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const m=document.querySelector('#'+b.dataset.id),open=m.classList.toggle('show');b.textContent=open?'收起 ↑':'展开阅读 ↓'})}
function shift(n){const d=new Date(el.date.value+'T12:00:00');d.setDate(d.getDate()+n);const v=d.toISOString().slice(0,10);if(v<=latest){el.date.value=v;render()}}
document.querySelector('#prev').onclick=()=>shift(-1);document.querySelector('#next').onclick=()=>shift(1);el.date.onchange=render;render();
</script></body></html>
