<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>乐乐每日情报</title><style>:root{--ink:#20211f;--paper:#f4f1eb;--line:#ddd8cf}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:PingFang SC,sans-serif}.hero{min-height:560px;padding:0 5vw;border-bottom:1px solid var(--line);background:radial-gradient(circle at 80% 20%,#dce7df,transparent 30%)}nav{height:88px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.18em}.intro{margin-top:90px}h1{font:500 clamp(56px,8vw,110px)/1 Georgia,serif}.calendar{position:absolute;right:5vw;top:100px;background:#faf8f3;padding:20px;border-radius:18px}.stream{columns:3 320px;gap:20px;padding:55px 5vw}.card{break-inside:avoid;padding:28px;margin-bottom:20px;cursor:pointer;border-radius:4px}.card h2{font:600 28px Georgia,serif}.modal{display:none;position:fixed;inset:0;background:#0005;padding:30px}.article{background:#fff;max-width:760px;margin:auto;padding:35px;line-height:2;border-radius:20px}@media(max-width:700px){.stream{columns:1}.calendar{display:none}}</style></head><body><header class="hero"><nav><div class="brand">LELE DAILY</div><div>日历回看</div></nav><div class="intro"><p>每日情报切片 · 北京时间 08:00 更新</p><h1>世界很大。<br>挑值得了解的。</h1></div><div class="calendar">2026年8月<br>1日　2日　3日</div></header><main id="stream" class="stream"></main><div id="modal" class="modal"><article class="article"><h2 id="title"></h2><div id="content"></div></article></div><script>const data=[{tag:'全球财经',title:'全球财经政策变化观察',content:'背景：全球主要经济体正在调整货币政策与产业政策。\n\n为什么重要：政策变化会影响投资、就业和产业结构。'},{tag:'中国经济',title:'中国新经济产业趋势',content:'关注人工智能、新能源、先进制造等产业变化。\n\n重点观察产业升级与消费变化。'},{tag:'旅行生活',title:'小众旅行路线与预算',content:'包含交通、住宿、餐饮费用，以及当地生活方式体验。'},{tag:'健康生活',title:'健身、咖啡与饮食趋势',content:'记录健康生活方式、训练方法、咖啡文化和健康菜谱。'}];const colors=['#edf3ef','#f5eee5','#edf0f6','#f3edf3'];stream.innerHTML=data.map((x,i)=>`<section class="card" style="background:${colors[i]}" onclick="openA(${i})"><small>${x.tag}</small><h2>${x.title}</h2><p>${x.content.slice(0,80)}...</p></section>`).join('');function openA(i){title.innerText=data[i].title;content.innerHTML=data[i].content.replace(/\n/g,'<br>');modal.style.display='block'}modal.onclick=()=>modal.style.display='none';</script></body></html>
